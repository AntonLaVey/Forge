name: Compile Tweak
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: /Users/runner/theos
    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Fix Homebrew & Install Dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
        run: |
          brew untap aws/tap || true
          brew install ldid dpkg xz

      - name: Setup Theos & SDKs
        run: |
          git clone --recursive https://github.com/theos/theos.git $THEOS
          rm -rf $THEOS/sdks
          git clone https://github.com/theos/sdks.git $THEOS/sdks
      - name: Build Tweak
        run: |
          make clean
          make FINALPACKAGE=1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SeedCatcher_Dylib
          path: .theos/obj/**/*.dylib
