name: Compile Library
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Get Substrate Library
        run: |
          # Pull the precompiled substrate library for linking
          curl -sSL https://github.com/theos/lib/raw/master/libsubstrate.dylib -o libsubstrate.dylib

      - name: Compile with Clang
        run: |
          mkdir -p output
          
          xcrun --sdk iphoneos clang++ -arch arm64 \
            -dynamiclib \
            -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
            -miphoneos-version-min=14.0 \
            -I. \
            -L. \
            -lsubstrate \
            -framework Foundation \
            -framework UIKit \
            Tweak.mm \
            -o output/SeedCatcher.dylib

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SeedCatcher_Dylib
          path: output/SeedCatcher.dylib
